interface:
  display_name: "Foundry TIDAS Authoring"
  short_description: "Author evidence-backed Foundry decisions and patches"
  default_prompt: "Use $foundry-tidas-authoring for the supplied current Foundry work item. Read its complete package, task brief, applicable registered decisions and context; keep user statements, interpreted decisions, AI assumptions and source facts distinct. Fill only the supplied decision or patch template with evidence and trace any adopted decision through supported fields. Return files and specific unresolved questions to the invoking workflow in plain language; never treat an answer as missing scientific evidence or write permission."
policy:
  allow_implicit_invocation: false
