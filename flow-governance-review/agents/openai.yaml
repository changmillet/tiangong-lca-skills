interface:
  display_name: "Flow Governance Review"
  short_description: "Run CLI-backed flow identity, build, review, repair, and publish gates"
  default_prompt: "Use $flow-governance-review to author unit_of_analysis and run CLI-backed flow gates. When applying a public Flow rule, read its verified spec 0.2.1 definition with `node scripts/read-public-rule.mjs --rule-id <id>`; keep workflow policy local. Before remote work check `tiangong-lca auth status --json`; require `doctor-auth` before commit, hand login to the human, and never request a password, code, token, or legacy API key."
